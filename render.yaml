services:
  - type: web
    name: samu-backend
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn ars_backend.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.11.0"
